particle_filter:
  ros__parameters:
    num_particles: 300
    initial_spread_xy: 0.3
    initial_spread_theta: 0.3
    alpha1: 0.05
    alpha2: 0.05
    alpha3: 0.05
    alpha4: 0.02
    laser_subsample: 10
    z_hit: 0.9
    z_rand: 0.1
